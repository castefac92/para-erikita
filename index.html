<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para mi Bob Esponja ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#050816;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

#background{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(circle at center,#16213e 0%,#050816 100%);
z-index:-2;
}

#stars{
position:fixed;
width:100%;
height:100%;
background-image:radial-gradient(white 1px,transparent 1px);
background-size:40px 40px;
opacity:.3;
animation:stars 80s linear infinite;
z-index:-1;
}

@keyframes stars{
from{transform:translateY(0);}
to{transform:translateY(800px);}
}

.container{
text-align:center;
padding:20px;
max-width:900px;
}

h1{
font-size:60px;
margin-bottom:20px;
}

p{
font-size:20px;
opacity:.9;
margin-bottom:20px;
line-height:1.6;
}

button{
padding:22px 55px;
font-size:24px;
border:none;
border-radius:50px;
cursor:pointer;
background:#00c3ff;
color:white;
transition:.3s;
box-shadow:0 0 25px #00c3ff;
}

button:hover{
transform:scale(1.08);
}

#mensaje{
display:none;
font-size:30px;
line-height:60px;
animation:fade .7s;
}

#finalMessage{
display:none;
animation:fade 2s;
}

.foto{
width:320px;
max-width:85%;
display:block;
margin:30px auto;
border-radius:25px;
border:4px solid #ff5ca8;
box-shadow:0 0 20px #ff5ca8,0 0 50px #ff5ca8;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div id="background"></div>
<div id="stars"></div>

<div class="container" id="inicio">

<h1>ANDROID SYSTEM</h1>

<p>Verificación requerida</p>

<button onclick="comenzar()">
🤖 Soy un androide
</button>

</div>

<div class="container" id="mensaje"></div>

<div class="container" id="finalMessage">

<img src="foto.jpg" class="foto" alt="Mi Bob Esponja">

<h1>❤️ Mi Bob Esponja ❤️</h1>

<p>Los androides no deberían enamorarse...</p>

<p>Pero desde que apareciste en mi vida, todo cambió.</p>

<p>
Gracias por hacerme sentir algo que ningún sistema,
ningún algoritmo y ninguna inteligencia artificial
podrían explicar.
</p>

<p style="font-size:28px;color:#ff6ec7;">
Te amo muchísimo ❤️
</p>

</div>

<script>

function esperar(ms){
return new Promise(resolve=>setTimeout(resolve,ms));
}

async function comenzar(){

document.getElementById("inicio").style.display="none";

const mensaje=document.getElementById("mensaje");
const final=document.getElementById("finalMessage");

mensaje.style.display="block";

mensaje.innerHTML="Inicializando sistema...";
await esperar(1800);

mensaje.innerHTML="Escaneando usuario...";
await esperar(1800);

mensaje.innerHTML="✔ IA detectada";
await esperar(1200);

mensaje.innerHTML+="<br>✔ Mi Bob Esponja encontrada ❤️";
await esperar(1800);

mensaje.innerHTML="<span style='color:#ff4d6d;font-size:42px;'>ERROR</span>";
await esperar(1800);

mensaje.innerHTML="Los androides no deberían enamorarse...";
await esperar(2500);

mensaje.style.display="none";
final.style.display="block";

}

</script>

</body>
</html>
