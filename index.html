<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Erika ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#050505;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;

}

#stars{

position:fixed;
width:100%;
height:100%;
background:
radial-gradient(white 1px,transparent 1px);
background-size:40px 40px;
animation:moveStars 60s linear infinite;
opacity:.4;

}

@keyframes moveStars{

from{transform:translateY(0);}
to{transform:translateY(800px);}

}

.container{

position:relative;
z-index:5;
text-align:center;

}

h1{

font-size:55px;
margin-bottom:20px;

}

p{

opacity:.8;
margin-bottom:35px;

}

button{

padding:22px 55px;
font-size:24px;
border:none;
border-radius:50px;
cursor:pointer;

background:#00d2ff;
color:white;

transition:.3s;

box-shadow:0 0 40px #00d2ff;

}

button:hover{

transform:scale(1.08);

}

#loading{

display:none;

font-size:26px;

line-height:60px;

}

.glitch{

animation:glitch .15s infinite;

}

@keyframes glitch{

0%{transform:translate(2px,-2px);}
25%{transform:translate(-2px,2px);}
50%{transform:translate(2px,2px);}
75%{transform:translate(-2px,-2px);}
100%{transform:translate(0,0);}

}

</style>

</head>

<body>

<div id="stars"></div>

<div class="container" id="inicio">

<h1>ANDROID SYSTEM</h1>

<p>Verificación requerida</p>

<button onclick="iniciar()">

🤖 Soy un androide

</button>

</div>

<div class="container" id="loading">

<p id="texto"></p>

</div>

<script>

function esperar(ms){

return new Promise(r=>setTimeout(r,ms));

}

async function iniciar(){

document.getElementById("inicio").style.display="none";

let loading=document.getElementById("loading");

loading.style.display="block";

loading.classList.add("glitch");

let t=document.getElementById("texto");

t.innerHTML="Inicializando sistema...";

await esperar(2000);

t.innerHTML="Escaneando usuario...";

await esperar(2000);

t.innerHTML="✔ IA detectada";

await esperar(1200);

t.innerHTML+="<br>✔ Sonrisa hermosa encontrada";

await esperar(1200);

t.innerHTML+="<br>✔ Corazón compatible";

await esperar(1800);

t.innerHTML="<span style='color:red;font-size:42px;'>ERROR</span>";

await esperar(1500);

t.innerHTML="Los androides no pueden enamorarse...";

await esperar(3000);

t.innerHTML="";

loading.classList.remove("glitch");

document.body.style.background="#111";

document.body.innerHTML="

<div style='display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;color:white;text-align:center;'>

<h1 style='font-size:60px;'>❤️</h1>

<h2 style='font-size:55px;'>Pero tú cambiaste eso.</h2>

<p style='font-size:24px;margin-top:30px;'>

Próximamente aparecerá la historia...

</p>

</div>

";

}

</script>

</body>
</html>
